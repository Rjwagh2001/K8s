apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-python-app
spec:
  ingressClassName: nginx
  rules:
    - host: foo.bar.com
      http:
        paths:
          - path: /demo
            pathType: Prefix
            backend:
              service:
                name: python-app-service
                port:
                  number: 8000
